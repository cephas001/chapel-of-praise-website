name: Accessibility (pa11y)

on:
  push:
    branches: [main]
    paths:
      - "admin_frontend/**"
      - ".github/workflows/pa11y.yml"
  pull_request:
    paths:
      - "admin_frontend/**"
      - ".github/workflows/pa11y.yml"
  workflow_dispatch:

defaults:
  run:
    working-directory: admin_frontend

jobs:
  pa11y:
    name: Lint, tests, build, and pa11y scan
    runs-on: ubuntu-latest
    env:
      NUXT_TELEMETRY_DISABLED: "1"
      NUXT_PUBLIC_API_BASE: http://localhost:5000/api/admin
      NUXT_PUBLIC_FIREBASE_API_KEY: ci-placeholder
      NUXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ci-placeholder.firebaseapp.com
      NUXT_PUBLIC_FIREBASE_PROJECT_ID: ci-placeholder
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: admin_frontend/package-lock.json

      - run: npm ci

      - run: npm run lint

      - run: npm run test

      - run: npm run build

      - name: Start preview server and run pa11y-ci
        run: |
          npx --yes start-server-and-test@2 \
            "npm run preview -- --port 3000" \
            http://localhost:3000 \
            "npx --yes pa11y-ci@3 --config .pa11yci.json"
